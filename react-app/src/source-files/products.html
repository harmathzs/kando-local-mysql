<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Mueslis</title>
  <style>
    /* Root and base styles for light theme */
    :root {
      --bg-color: #f9f9f9;
      --nav-bg: #ffffff;
      --nav-text: #333;
      --nav-hover: #ddd;
      --nav-expanded-bg: #e0e0e0;
      --content-bg: #fff;
      --text-color: #222;
      --table-border: #ccc;
      --table-header-bg: #f0f0f0;
      --table-row-hover: #f7f7f7;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Navbar container */
    nav {
      background-color: var(--nav-bg);
      color: var(--nav-text);
      width: 60px;
      transition: width 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      user-select: none;
    }

    nav.expanded {
      width: 200px;
      background-color: var(--nav-expanded-bg);
    }

    nav .menu-item {
      padding: 1rem;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 1px solid var(--table-border);
      display: flex;
      align-items: center;
      transition: background-color 0.2s ease;
      font-weight: 600;
    }

    nav .menu-item:hover {
      background-color: var(--nav-hover);
    }

    nav .menu-text {
      margin-left: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    nav.expanded .menu-text {
      opacity: 1;
      pointer-events: auto;
    }

    /* Content area - horizontally scrollable */
    main {
      flex-grow: 1;
      background-color: var(--content-bg);
      overflow-x: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    main h1 {
      margin: 0 0 1rem 0;
      font-weight: 700;
      font-size: 2rem;
      white-space: nowrap;
    }

    /* Table styles */
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px; /* so horizontal scroll triggers if screen smaller */
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
      border-radius: 8px;
      overflow: hidden;
    }

    thead {
      background-color: var(--table-header-bg);
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--table-border);
    }

    tbody tr:hover {
      background-color: var(--table-row-hover);
    }
  </style>
</head>
<body>
  <nav id="navbar" title="Toggle menu width">
    <div class="menu-item" tabindex="0">
      <span class="menu-icon">📦</span>
      <span class="menu-text">Products</span>
    </div>
    <div class="menu-item" tabindex="0">
      <span class="menu-icon">💰</span>
      <span class="menu-text">Prices</span>
    </div>
    <div class="menu-item" tabindex="0">
      <span class="menu-icon">ℹ️</span>
      <span class="menu-text">About</span>
    </div>
  </nav>

  <main>
    <h1>My mueslis</h1>
    <table>
      <thead>
        <tr>
          <th>id</th>
          <th>name</th>
          <th>price</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>1</td><td>Classic Muesli</td><td>$4.65</td></tr>
        <tr><td>2</td><td>Berry Lovers</td><td>$3.02</td></tr>
        <tr><td>3</td><td>Nuts & Honey</td><td>$4.12</td></tr>
        <tr><td>4</td><td>Tropical Mix</td><td>$4.93</td></tr>
        <tr><td>5</td><td>Choco Delight</td><td>$2.73</td></tr>
        <tr><td>6</td><td>Organic Oats</td><td>$3.55</td></tr>
        <tr><td>7</td><td>Apple Cinnamon</td><td>$5.42</td></tr>
        <tr><td>8</td><td>Fruit & Nut</td><td>$5.60</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    const navbar = document.getElementById('navbar');
    navbar.addEventListener('click', () => {
      navbar.classList.toggle('expanded');
    });
  </script>
</body>
</html>
